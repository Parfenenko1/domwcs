<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Страница не найдена — Дом танца WCS</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1310">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
  @font-face{font-family:'Nauryz Red Keds'; src:url('/nauryz.woff') format('woff'); font-weight:400 700; font-display:swap;}
  @font-face{font-family:'Fira Sans Condensed'; src:url('/fira-sans-condensed-regular.woff') format('woff'); font-weight:400; font-display:swap;}
  :root{--night:#1b1310; --cream:#f2e7d3; --cream-dim:#cdbca4; --terra-btn:#a64e07; --terra-on-night:#e07a24;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; display:flex; align-items:center; justify-content:center; padding:32px 20px; background:var(--night); color:var(--cream);
       font-family:'Fira Sans Condensed','Arial Narrow',-apple-system,'Segoe UI',sans-serif; font-size:18px; line-height:1.5; text-align:center;}
  main{max-width:560px;}
  img{display:block; margin:0 auto 28px;}
  h1{font-family:'Nauryz Red Keds','Fira Sans Condensed',Georgia,serif; font-weight:700; font-size:clamp(40px,9vw,72px); line-height:1; margin:0 0 18px;}
  h1 span{color:var(--terra-on-night);}
  p{margin:0 0 28px; color:var(--cream-dim);}
  .btns{display:flex; flex-wrap:wrap; gap:12px; justify-content:center;}
  a.btn{display:inline-block; padding:14px 24px; border-radius:999px; text-decoration:none; font-weight:500; letter-spacing:.06em; text-transform:uppercase; font-size:14px;}
  .main{background:var(--terra-btn); color:#fff4e6;}
  .line{border:1px solid rgba(242,231,211,.25); color:var(--cream);}
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="Логотип Дома танца WCS" width="116" height="100">
  <h1>Такой страницы <span>нет</span></h1>
  <p>Возможно, ссылка устарела. Всё о вест-кост свинге в Доме — расписание, тарифы и запись на пробное — на главной.</p>
  <div class="btns">
    <a class="btn main" href="/">На главную</a>
    <a class="btn line" href="/#schedule">Расписание</a>
  </div>
</main>
</body>
</html>

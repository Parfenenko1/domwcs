name: Обновление расписания из Telegram

on:
  schedule:
    # Каждый день в 09:00 по Москве (06:00 UTC).
    # Если расписание выкладывают в конкретный день недели — можно сузить,
    # но ежедневная проверка ничего не сломает и не требует докрутки.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # кнопка "Run workflow" в интерфейсе GitHub — запустить вручную

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Запустить скрипт обновления
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python scripts/update_schedule.py

      - name: Закоммитить изменения, если они есть
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add schedule.jpg schedule-meta.json scripts/telegram_offset.txt
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит не нужен."
          else
            git commit -m "Автообновление расписания"
            git push
          fi

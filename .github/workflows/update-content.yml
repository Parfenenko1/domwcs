name: Обновление расписания и новостей из Telegram

on:
  schedule:
    # Дважды в день: 06:00 и 18:00 по Москве (03:00 и 15:00 UTC).
   - cron: "0 9 * * *"
  workflow_dispatch: {}   # кнопка "Run workflow" в интерфейсе GitHub — запустить вручную

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Запустить скрипт обновления
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python scripts/update_content.py

      - name: Закоммитить изменения, если они есть
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          for f in schedule.jpg schedule-meta.json events.json events-meta.json subscribers.json scripts/telegram_offset.txt; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит не нужен."
          else
            git commit -m "Автообновление расписания и новостей"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Пуш отклонён (кто-то успел закоммитить раньше), подтягиваю свежие изменения и пробую снова..."
              git pull --rebase origin main
              sleep 3
            done
          fi

name: Обновление расписания и новостей из Telegram

on:
  schedule:
    # Каждые 5 минут (чаще GitHub не запускает; в часы нагрузки запуск может опоздать на несколько минут).
    # Репозиторий публичный — запуски бесплатные. Сайт пересобирается, только когда в канале появилось
    # что-то для сайта: без изменений задача ничего не коммитит.
    - cron: "*/5 * * * *"
  workflow_dispatch:      # кнопка "Run workflow" в интерфейсе GitHub — запустить вручную
    inputs:
      vk_post:
        description: "Отправить в ВК посты, вышедшие до включения: номера или ссылки через запятую, или «сегодня»"
        required: false
        default: ""

permissions:
  contents: write

# не больше одного запуска одновременно: следующий ждёт, пока предыдущий закоммитит, иначе они толкаются при push
concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить библиотеки для картинок
        run: pip install --quiet pillow numpy

      - name: Забрать посты из Telegram (расписание, новости с фото, подписчики) и продублировать в ВК
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          # дублирование в группу ВКонтакте; пока секретов нет — выключено
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}   # необязательно: группа берётся из ключа
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_BACKFILL: ${{ github.event.inputs.vk_post }}
        run: python scripts/update_content.py

      - name: Распознать расписание (неделя, группы, преподаватели)
        run: |
          if [ "$(python scripts/update_week.py --need)" = "yes" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus > /dev/null
            # Точные модели распознавания (лучше читают мелкий текст); если не скачались — берём системные
            TD="$RUNNER_TEMP/tessdata"; mkdir -p "$TD"
            SYS="$(dirname "$(find /usr/share/tesseract-ocr -name eng.traineddata | head -1)")"
            cp -r "$SYS/configs" "$TD/"
            for L in rus eng; do
              curl -sfL --retry 3 -o "$TD/$L.traineddata" "https://github.com/tesseract-ocr/tessdata_best/raw/main/$L.traineddata" \
                || cp "$SYS/$L.traineddata" "$TD/"
            done
            TESSDATA_PREFIX="$TD" python scripts/update_week.py \
              || echo "Расписание распознать не получилось — сайт покажет прошлые данные."
          else
            echo "Картинка расписания не менялась — распознавать нечего."
          fi

      - name: Закоммитить изменения, если они есть
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          for f in schedule.jpg schedule-meta.json week.json groups.json events.json events-meta.json subscribers.json scripts/telegram_offset.txt scripts/news_lookups.json scripts/vk_posts.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if [ -d news ] || git ls-files --error-unmatch news >/dev/null 2>&1; then
            git add -A news
          fi
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит не нужен."
            exit 0
          fi
          # Если поменялись только служебные файлы или число подписчиков — коммитим с [skip netlify]:
          # сайт зря не пересобирается, а изменения уедут вместе со следующей настоящей публикацией.
          SITE_CHANGES="$(git diff --cached --name-only | grep -v -E '^(scripts/|subscribers\.json$)' || true)"
          if [ -z "$SITE_CHANGES" ]; then
            MSG="Бот: служебное обновление [skip netlify]"
          else
            MSG="Автообновление расписания и новостей"
          fi
          git commit -m "$MSG"
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Пуш отклонён (кто-то успел закоммитить раньше), подтягиваю свежие изменения и пробую снова..."
            git pull --rebase origin main
            sleep 3
          done

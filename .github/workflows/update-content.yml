name: Обновление расписания и новостей из Telegram

on:
  schedule:
    # Дважды в сутки: 12:00 и 00:00 по Москве (09:00 и 21:00 UTC).
   - cron: "0 9,21 * * *"
  workflow_dispatch: {}   # кнопка "Run workflow" в интерфейсе GitHub — запустить вручную

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Запустить скрипт обновления
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python scripts/update_content.py

      - name: Распознать неделю по картинке расписания (для блока «Неделя в Доме»)
        run: |
          if [ "$(python scripts/update_week.py --need)" = "yes" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus > /dev/null
            pip install --quiet pillow
            python scripts/update_week.py || echo "Неделю распознать не получилось — сайт покажет обычное расписание."
          else
            echo "Картинка расписания не менялась — распознавать нечего."
          fi

      - name: Закоммитить изменения, если они есть
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          for f in schedule.jpg schedule-meta.json week.json events.json events-meta.json subscribers.json scripts/telegram_offset.txt; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит не нужен."
          else
            git commit -m "Автообновление расписания и новостей"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Пуш отклонён (кто-то успел закоммитить раньше), подтягиваю свежие изменения и пробую снова..."
              git pull --rebase origin main
              sleep 3
            done
          fi
